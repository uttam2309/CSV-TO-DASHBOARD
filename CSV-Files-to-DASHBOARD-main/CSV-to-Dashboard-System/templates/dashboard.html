<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
background:#f4f7fb;
}

.sidebar{
width:240px;
height:100vh;
position:fixed;
background:#0d6efd;
padding-top:20px;
}

.sidebar a{
display:block;
padding:15px;
color:white;
text-decoration:none;
font-size:18px;
}

.sidebar a:hover{
background:white;
color:#0d6efd;
}

.main{
margin-left:250px;
padding:30px;
}

.card{
border:none;
border-radius:15px;
}

</style>

</head>

<body>

<div class="sidebar">

<h3 class="text-center text-white mb-4">

CSV Dashboard

</h3>

<a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>

<a href="/upload"><i class="bi bi-upload"></i> Upload CSV</a>

<a href="/analytics"><i class="bi bi-bar-chart"></i> Analytics</a>

<a href="/history"><i class="bi bi-clock-history"></i> History</a>

<a href="/profile"><i class="bi bi-person"></i> Profile</a>

<a href="/"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<div class="main">

<h2 class="mb-4">

Welcome to CSV Dashboard System

</h2>

<div class="row">

<div class="col-md-3">

<div class="card shadow p-4">

<h5>Total Files</h5>

<h2>{{ total_files|default(0) }}</h2>

</div>

</div>

<div class="col-md-3">

<div class="card shadow p-4">

<h5>Total Rows</h5>

<h2>{{ total_rows|default(0) }}</h2>

</div>

</div>

<div class="col-md-3">

<div class="card shadow p-4">

<h5>Total Columns</h5>

<h2>{{ total_columns|default(0) }}</h2>

</div>

</div>

<div class="col-md-3">

<div class="card shadow p-4">

<h5>Status</h5>

<h2>Ready ✅</h2>

</div>

</div>

</div>

</div>

</body>

</html>
