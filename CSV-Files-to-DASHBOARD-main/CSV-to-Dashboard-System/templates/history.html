<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Upload History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="mb-4">

Upload History

</h2>

<table class="table table-bordered table-striped">

<thead class="table-dark">

<tr>

<th>#</th>

<th>Filename</th>

<th>Rows</th>

<th>Columns</th>

<th>Date</th>

</tr>

</thead>

<tbody>

{% for file in uploads %}

<tr>

<td>{{ loop.index }}</td>

<td>{{ file.filename }}</td>

<td>{{ file.rows }}</td>

<td>{{ file.columns }}</td>

<td>{{ file.uploaded_at }}</td>

</tr>

{% endfor %}

</tbody>

</table>

<a href="/dashboard" class="btn btn-primary">

Back to Dashboard

</a>

</div>

</body>

</html>
